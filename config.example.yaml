# QuickDraw Configuration
# Copy this to ~/.quickdraw/config.yaml and customize.

workspace: ~/.quickdraw

# --- Platform Database (optional) ---
# When set, QuickDraw records runs, audit events, and platform state to Postgres.
# Requires: pip install 'quickdraw[platform]'
# database_url: postgresql+asyncpg://quickdraw:quickdraw@localhost:5432/quickdraw

# --- Temporal (optional) ---
# When set, QuickDraw can submit durable runs to a Temporal cluster.
# temporal_address: localhost:7233

# --- LLM Provider ---
llm:
  # Back-compat (single provider):
  # provider: anthropic
  # model: claude-sonnet-4-5-20250929
  # max_tokens: 4096

  # New: ordered provider list (failover in order).
  # Install deps: pip install 'quickdraw[llm]'
  max_tokens: 4096
  providers:
    - provider: anthropic
      model: claude-sonnet-4-5-20250929
    - provider: openai
      model: gpt-4o-mini
      api_key: ${OPENAI_API_KEY}
    - provider: gemini
      model: gemini-2.0-flash
      api_key: ${GEMINI_API_KEY}

# --- Agent Definitions ---
# Each agent has a name, a SOUL file (personality), and optionally a model override.
# Paths are relative to the workspace directory.
agents:
  main:
    name: Jarvis
    soul: SOUL.md

  researcher:
    name: Scout
    soul: souls/researcher.md

# --- Channels ---
# Enable the channels you want. Each channel normalizes messages and routes
# them through the same agent with shared sessions and memory.
channels:
  # Terminal REPL — always useful for testing
  repl:
    enabled: true

  # Discord — listens for DMs and @mentions
  # Requires: pip install 'quickdraw[discord]'
  discord:
    enabled: false
    token: ${DISCORD_BOT_TOKEN}
    session_scope: per-user  # per-user | per-channel | per-channel-peer

  # Signal — via signal-cli REST API (Docker)
  # Requires: docker run -d -p 8081:8080 -v ./signal-data:/home/.local/share/signal-cli bbernhard/signal-cli-rest-api
  signal:
    enabled: false
    api_url: http://localhost:8081
    number: ${SIGNAL_NUMBER}        # Your registered Signal number (e.g. +1234567890)
    session_scope: per-channel      # per-user | per-channel | per-channel-peer
    poll_interval: 1.0              # Seconds between polling for new messages

  # HTTP API — POST /chat for programmatic access
  http:
    enabled: false
    port: 5000
    host: 127.0.0.1

  # Microsoft Teams — Bot Framework webhook
  # Requires: pip install 'quickdraw[teams]'
  # Register a bot at https://dev.botframework.com and set the messaging
  # endpoint to https://<your-host>/api/messages
  teams:
    enabled: false
    app_id: ${MS_APP_ID}
    app_password: ${MS_APP_PASSWORD}
    port: 3978

# --- Heartbeats ---
# Scheduled agent tasks. Each heartbeat runs on a cron schedule with its
# own isolated session so it doesn't clutter interactive conversations.
heartbeats:
  morning-briefing:
    schedule: "30 7 * * *"
    agent: main
    prompt: "Good morning! Check the date and give me a motivational quote."

# --- Permission Controls ---
# Controls which shell commands the agent can run without approval.
#   ask:    prompt the user for approval on unknown commands
#   record: allow but log for review
#   ignore: allow everything
permissions:
  mode: ask
  safe_commands:
    - ls
    - cat
    - head
    - tail
    - wc
    - date
    - whoami
    - echo
    - pwd
    - which
    - git
    - python
    - node
    - npm
