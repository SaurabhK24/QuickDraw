[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickdraw"
version = "0.1.0"
description = "An agentic framework for building 'always-on' AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic",
    "pyyaml",
    "aiohttp",
    "croniter",
]

[project.optional-dependencies]
platform = [
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "temporalio",
]
discord = ["discord.py"]
teams = [
    "botbuilder-core",
    "botbuilder-integration-aiohttp",
]
all = [
    "discord.py",
    "botbuilder-core",
    "botbuilder-integration-aiohttp",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "sqlalchemy[asyncio]",
    "asyncpg",
]

[project.scripts]
quickdraw = "quickdraw.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100
